version: '3.8'

services: 
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80" 
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./app:/app  
    depends_on:
      db:
        condition: service_healthy 
      testdb:
        condition: service_healthy     

  db:
    image: postgres:18.4-bookworm
    restart: always
    shm_size: 256mb                  # زيادة الـ Shared Memory لتقليل الـ Disk I/O
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]    
      interval: 3s                    # تسريع الفحص عند بدء التشغيل
      timeout: 3s
      retries: 5

  testdb:
    image: postgres:18.4-bookworm
    restart: always
    shm_size: 256mb                  # زيادة الـ Shared Memory
    tmpfs:                           # تشغيل قاعدة بيانات الاختبار بالكامل داخل الذاكرة (RAM)
      - /var/lib/postgresql/data
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: testdb
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$TEST_POSTGRES_DB"]    
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
