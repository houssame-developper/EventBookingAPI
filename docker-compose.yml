version: '3.8'

services: 
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80" 
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./app:/app  
    depends_on:
      db:
        condition: service_healthy 

      testdb:
        condition: service_healthy     

  db:
    image: postgres:18.4-bookworm
    restart: always
    shm_size: 128mb
    cpus: 0.5
    env_file:
      -  ./.env
    volumes:
      - postgres_data:/var/lib/postgresql
    
    ports:
      - "5433:5432"

    healthcheck:
      test : ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]    
      interval: 5s
      timeout: 5s
      retries: 5

  testdb:
    image: postgres:18.4-bookworm
    restart: always
    shm_size: 128mb
    cpus: 0.5
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: testdb
    volumes:
      - testdb_data:/var/lib/postgresql
    
    ports:
      - "5434:5432"

    healthcheck:
      test : ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$TEST_POSTGRES_DB"]    
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  testdb_data:
